<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Bungee&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#1E1033; --stage-2:#2C1850; --ink:#FFF6E5;
    --pink:#FF3D7F; --gold:#FFC233; --aqua:#2DD4BF; --violet:#8B5CF6; --orange:#FF7A3D;
    --display:"Bungee", "Arial Black", Impact, sans-serif;
    --card:"Andika", "Comic Sans MS", system-ui, sans-serif;
    --ui:"Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--ui); color:var(--ink);
    background:
      radial-gradient(ellipse 70% 55% at 50% -5%, #5B3394 0%, transparent 70%),
      radial-gradient(circle at 10% 110%, rgba(255,61,127,.18), transparent 40%),
      radial-gradient(circle at 95% 105%, rgba(45,212,191,.15), transparent 40%),
      var(--stage);
    display:grid; grid-template-rows:auto 1fr auto; min-height:100dvh; overflow-x:hidden;
  }
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  /* Header */
  header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.75rem;padding:1rem clamp(1rem,3vw,2rem)}
  h1{
    margin:0;font-family:var(--display);font-weight:400;letter-spacing:.02em;
    font-size:clamp(1.5rem,3.2vw,2.4rem);color:var(--gold);
    text-shadow:3px 3px 0 var(--pink), 6px 6px 0 rgba(0,0,0,.35);
  }
  .controls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center}
  .icon-btn{width:2.6rem;height:2.6rem;padding:0;justify-content:center}
  .icon-btn svg{width:1.3rem;height:1.3rem}
  .icon-btn .exit{display:none}
  /* Full screen: hide the menu, keep only the exit button in the corner */
  body.is-fs .controls > :not(#fsBtn){display:none}
  body.is-fs #fsBtn{position:fixed;top:1rem;right:1rem;z-index:10}
  body.is-fs #fsBtn .enter{display:none}
  body.is-fs #fsBtn .exit{display:block}
  .ctl{
    background:rgba(255,246,229,.07);border:2px solid rgba(255,246,229,.22);
    border-radius:999px;padding:.45rem .95rem;font-weight:600;font-size:.95rem;cursor:pointer;
    display:inline-flex;align-items:center;gap:.4rem;transition:background .15s,border-color .15s;
  }
  .ctl:hover{background:rgba(255,246,229,.14)}
  .ctl[aria-pressed="true"]{background:var(--aqua);border-color:var(--aqua);color:var(--stage)}
  .vol{display:inline-flex;align-items:center;gap:.4rem;font-size:.9rem;opacity:.85}
  .vol input{width:90px;accent-color:var(--aqua)}

  /* Stage */
  main{display:grid;place-items:center;padding:1rem;gap:1rem;align-content:center}
  .deck{position:relative;width:min(72vw,50dvh,500px);aspect-ratio:1/1}
  .vinyl{
    position:absolute;inset:3%;border-radius:50%;z-index:0;
    background:
      radial-gradient(circle, #FFF6E5 0 2.2%, var(--label,#FFC233) 2.6% 17%, #0d0d0d 17.5% 19%, transparent 19.5%),
      repeating-radial-gradient(circle, #181818 0 2px, #2a2a2a 2.5px 4px);
    box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 0 0 3px #0d0d0d;
    transform:translateX(26%);transition:transform .55s cubic-bezier(.3,1.4,.5,1);
  }
  .vinyl::after{ /* sheen */
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 30deg, transparent 0 10%, rgba(255,255,255,.12) 14%, transparent 20% 60%, rgba(255,255,255,.08) 64%, transparent 70%);
  }
  .vinyl.out{transform:translateX(42%)}
  .vinyl.spin{animation:spin 1.8s linear infinite}
  .vinyl.spin.out{animation:spinOut 1.8s linear infinite}
  @keyframes spin{from{transform:translateX(26%) rotate(0)}to{transform:translateX(26%) rotate(360deg)}}
  @keyframes spinOut{from{transform:translateX(42%) rotate(0)}to{transform:translateX(42%) rotate(360deg)}}

  .card{
    position:relative;z-index:1;width:100%;height:100%;border:0;border-radius:14px;cursor:pointer;
    background:var(--bg,var(--stage-2));color:var(--fg,var(--ink));
    box-shadow:0 30px 60px rgba(0,0,0,.5), inset 0 0 0 6px rgba(255,255,255,.2);
    display:grid;place-items:center;padding:12% 9% 22%;overflow:hidden;
    transform-origin:50% 50%;
  }
  .card::after{ /* retro sleeve stripes */
    content:"";position:absolute;left:0;right:0;bottom:7%;height:10%;
    background:linear-gradient(var(--s1,var(--pink)) 0 33%, var(--s2,var(--gold)) 33% 66%, var(--s3,var(--aqua)) 66%);
    opacity:.9;
  }
  .card.idle{background:repeating-linear-gradient(135deg,var(--stage-2) 0 22px,#341D5E 22px 44px);border:3px dashed rgba(255,246,229,.35)}
  .card .count{position:absolute;top:5%;left:6%;font-weight:800;font-size:clamp(.8rem,1.8vw,1.05rem);opacity:.8}
  .card .word{
    font-family:var(--card);font-weight:700;line-height:1.1;text-align:center;letter-spacing:.01em;
    font-size:var(--fs,3rem);overflow-wrap:break-word;hyphens:auto;max-width:100%;
    text-shadow:0 3px 0 rgba(0,0,0,.12);
  }
  .card.idle .word{color:var(--gold);text-shadow:3px 3px 0 var(--pink)}
  .card.deal{animation:deal .5s cubic-bezier(.2,1.3,.4,1)}
  @keyframes deal{
    0%{transform:perspective(900px) rotateY(-80deg) scale(.85)}
    100%{transform:perspective(900px) rotateY(0) scale(1)}
  }
  .card:active{transform:scale(.98)}
  .hint{margin:0;font-size:1rem;opacity:.75;text-align:center}

  /* Drawn tray */
  footer{background:rgba(0,0,0,.28);border-top:2px solid rgba(255,246,229,.12);padding:.8rem clamp(1rem,3vw,2rem) 1rem}
  footer{text-align:center}
  footer h2{margin:0 0 .6rem;font-size:1.05rem;font-weight:800}
  footer h2 span{opacity:.6;font-weight:600}
  .tray{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-height:24dvh;overflow-y:auto}
  .tray li{
    background:var(--bg);color:var(--fg);border-radius:8px;padding:.35rem .75rem .35rem .4rem;
    font-weight:800;font-size:clamp(.95rem,1.6vw,1.15rem);display:inline-flex;align-items:center;gap:.45rem;
  }
  .tray li b{font-size:.75em;background:rgba(0,0,0,.2);border-radius:5px;padding:.05rem .4rem;min-width:1.7em;text-align:center}
  .tray li.newest{outline:3px solid var(--ink);animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .empty{opacity:.55;font-size:.95rem}

  /* Edit dialog */
  dialog{border:0;border-radius:16px;padding:1.4rem;width:min(92vw,520px);background:var(--stage-2);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.6)}
  dialog::backdrop{background:rgba(10,4,20,.7)}
  dialog h2{margin:0 0 .3rem;font-family:var(--display);font-weight:400;color:var(--gold)}
  dialog p{margin:0 0 .8rem;opacity:.8}
  textarea{width:100%;height:45dvh;border-radius:10px;border:2px solid rgba(255,246,229,.25);background:var(--stage);color:var(--ink);padding:.7rem;font:600 1rem/1.5 var(--ui);resize:vertical}
  .row{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end;margin-top:.9rem}
  .ctl.primary{background:var(--gold);border-color:var(--gold);color:var(--stage)}
  .ctl.left{margin-right:auto}

  @media (max-width:600px){ .vol{display:none} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<header>
  <h1>Music Bingo</h1>
  <div class="controls">
    <button class="ctl" id="musicBtn" aria-pressed="false">🎵 Music</button>
    <label class="vol">Volume <input type="range" id="vol" min="0" max="100" value="45"></label>
    <button class="ctl" id="sfxBtn" aria-pressed="true">🔔 Sounds</button>
    <button class="ctl" id="editBtn">✏️ Edit cards</button>
    <button class="ctl" id="resetBtn">↺ Start over</button>
    <button class="ctl icon-btn" id="fsBtn" aria-label="Enter full screen" title="Full screen">
      <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="deck">
    <div class="vinyl" id="vinyl" aria-hidden="true"></div>
    <button class="card idle" id="card" aria-live="polite">
      <span class="count" id="count"></span>
      <span class="word" id="word">Click to draw</span>
    </button>
  </div>
  <p class="hint" id="hint">Click the card or press the space bar to draw the next one</p>
</main>

<footer>
  <h2>Drawn so far <span id="drawnCount">(0)</span></h2>
  <ul class="tray" id="tray"></ul>
</footer>

<dialog id="editor">
  <h2>Edit cards</h2>
  <p>Type one card per line. Saving starts a new game.</p>
  <textarea id="cardText" spellcheck="false"></textarea>
  <div class="row">
    <button class="ctl left" id="defaultsBtn">Restore sample cards</button>
    <button class="ctl" id="cancelBtn">Cancel</button>
    <button class="ctl primary" id="saveBtn">Save cards</button>
  </div>
</dialog>

<dialog id="confirmBox">
  <h2>Start a new game?</h2>
  <p>All drawn cards will be cleared and the deck reshuffled.</p>
  <div class="row">
    <button class="ctl" id="keepBtn">Keep playing</button>
    <button class="ctl primary" id="newGameBtn">Start new game</button>
  </div>
</dialog>

<script>
/* ============ YOUR CARDS ============
   Replace this list with your own cards (one per line in quotes),
   or use the "Edit cards" button in the page. */
const DEFAULT_CARDS = [
  "📝 Lyrics","🎵 Melody","🎸 Electric Guitar","🪈 Flute","🪘 Percussion","🤖 Vocaloid",
  "🥁 Drum","🪇 Instrument","🎉 Pop","🎹 Piano","🎻 Violin","🎶 Harmony",
  "Soprano","Pitch","⏱️ Tempo","🔺 Triangle","💓 Beat","👫 Duet",
  "🎼 Orchestra","Keyboard","🤘 Rock","Minor","💃 Dance","Cello",
  "Tune","🎺 Trumpet","Twice","🔊 Bass","🎷 Saxophone","🎤 Singer",
  "🎧 Hip Hop","Acoustic","Jazz"
];

/* ============ STATE ============ */
const KEY = "musicBingo.v2";
const COLORS = [
  {bg:"#FF3D7F",fg:"#1E1033",s:["#FFC233","#FFF6E5","#2DD4BF"]},
  {bg:"#FFC233",fg:"#1E1033",s:["#FF3D7F","#FF7A3D","#8B5CF6"]},
  {bg:"#2DD4BF",fg:"#1E1033",s:["#8B5CF6","#FFF6E5","#FF3D7F"]},
  {bg:"#8B5CF6",fg:"#FFF6E5",s:["#FFC233","#FF3D7F","#2DD4BF"]},
  {bg:"#FF7A3D",fg:"#1E1033",s:["#FFF6E5","#FFC233","#8B5CF6"]}
];
let cards = [...DEFAULT_CARDS], drawn = [], remaining = [];

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.cards) && s.cards.length){ cards = s.cards; drawn = (s.drawn||[]).filter(i=>i<cards.length); }
  }catch(e){}
  rebuildRemaining();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({cards, drawn})); }catch(e){} }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function rebuildRemaining(){ remaining = shuffle(cards.map((_,i)=>i).filter(i=>!drawn.includes(i))); }
const colorOf = i => COLORS[i % COLORS.length];

/* ============ UI ============ */
const $ = id => document.getElementById(id);
const cardEl=$("card"), wordEl=$("word"), countEl=$("count"), vinyl=$("vinyl"), tray=$("tray");

function fitText(){
  const max = cardEl.clientWidth * 0.2;
  let fs = max;
  wordEl.style.setProperty("--fs", fs+"px");
  const box = cardEl.clientHeight * 0.62, w = cardEl.clientWidth * 0.84;
  while(fs > 14 && (wordEl.scrollHeight > box || wordEl.scrollWidth > w)){
    fs -= 2; wordEl.style.setProperty("--fs", fs+"px");
  }
}

function renderCard(animate){
  if(!drawn.length){
    cardEl.className = "card idle";
    cardEl.removeAttribute("style");
    wordEl.textContent = "Click to draw";
    countEl.textContent = cards.length + " cards ready";
    vinyl.style.setProperty("--label", "#FFC233");
  } else {
    const i = drawn[drawn.length-1], c = colorOf(i);
    cardEl.className = "card";
    cardEl.style.cssText = `--bg:${c.bg};--fg:${c.fg};--s1:${c.s[0]};--s2:${c.s[1]};--s3:${c.s[2]}`;
    wordEl.textContent = cards[i];
    countEl.textContent = `Card ${drawn.length} of ${cards.length}`;
    vinyl.style.setProperty("--label", c.bg);
    if(animate){ void cardEl.offsetWidth; cardEl.classList.add("deal"); }
  }
  $("hint").textContent = remaining.length || !drawn.length
    ? "Click the card or press the space bar to draw the next one"
    : "All cards drawn. Press Start over for a new game.";
  fitText();
}

function renderTray(){
  $("drawnCount").textContent = `(${drawn.length})`;
  tray.innerHTML = "";
  if(!drawn.length){ tray.innerHTML = '<li class="empty" style="background:none">Drawn cards will appear here</li>'; return; }
  for(let n = drawn.length-1; n >= 0; n--){
    const i = drawn[n], c = colorOf(i), li = document.createElement("li");
    li.style.cssText = `--bg:${c.bg};--fg:${c.fg}`;
    if(n === drawn.length-1) li.className = "newest";
    const b = document.createElement("b"); b.textContent = n+1;
    li.append(b, document.createTextNode(cards[i]));
    tray.append(li);
  }
}

function draw(){
  ensureAudio();
  if(!remaining.length){ sfx.empty(); return; }
  drawn.push(remaining.pop());
  save(); sfx.draw();
  vinyl.classList.add("out"); setTimeout(()=>vinyl.classList.remove("out"), 650);
  renderCard(true); renderTray();
}

function startOver(ask=true){
  if(ask && drawn.length){ $("confirmBox").showModal(); return; }
  drawn = []; rebuildRemaining(); save(); ensureAudio(); sfx.reset();
  renderCard(false); renderTray();
}

/* ============ AUDIO (all generated live, so it's copyright-free) ============ */
let ctx, master, musicBus, sfxBus, noiseBuf, musicOn=false, sfxOn=true, timer=null, step=0, nextTime=0;
function ensureAudio(){
  if(ctx){ if(ctx.state==="suspended") ctx.resume(); return; }
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
  master = ctx.createGain(); master.gain.value = .9; master.connect(comp);
  musicBus = ctx.createGain(); musicBus.gain.value = $("vol").value/100; musicBus.connect(master);
  sfxBus = ctx.createGain(); sfxBus.gain.value = .8; sfxBus.connect(master);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
}
const freq = m => 440*Math.pow(2,(m-69)/12);
function env(g,t,peak,a,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec); }
function tone(type,f,t,peak,a,dec,dest,filt){
  const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  let node=o; if(filt){ const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=filt; o.connect(lp); node=lp; }
  node.connect(g); g.connect(dest); env(g,t,peak,a,dec); o.start(t); o.stop(t+a+dec+.05); return o;
}
function noise(t,peak,dec,type,f,dest,q=1){
  const s=ctx.createBufferSource(), fl=ctx.createBiquadFilter(), g=ctx.createGain();
  s.buffer=noiseBuf; fl.type=type; fl.frequency.value=f; fl.Q.value=q;
  s.connect(fl); fl.connect(g); g.connect(dest); env(g,t,peak,.002,dec); s.start(t); s.stop(t+dec+.05); return fl;
}

/* Music: a laid-back groove in A minor, 96 BPM */
const BPM=96, SIX=60/BPM/4;
const CHORDS=[[57,60,64],[57,60,65],[55,60,64],[55,59,62]]; // Am F C G
const ROOTS=[45,41,48,43];
const ARP=[0,1,2,1,2,1,0,2];
function kick(t){ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(42,t+.14); o.connect(g); g.connect(musicBus); env(g,t,.9,.003,.32); o.start(t); o.stop(t+.4); }
function snare(t){ noise(t,.32,.16,"highpass",1400,musicBus); tone("triangle",185,t,.18,.002,.08,musicBus); }
function hat(t,v){ noise(t,v,.035,"highpass",7500,musicBus); }
function tick(s,t){
  const bar=Math.floor(s/16)%4, st=s%16, ch=CHORDS[bar], root=ROOTS[bar];
  if(st===0||st===8||st===10) kick(t);
  if(st===4||st===12) snare(t);
  if(st%2===0) hat(t, st%4===2?.09:.05); else if(st===7||st===15) hat(t,.03);
  if(st===0) ch.forEach(m=>tone("triangle",freq(m),t,.045,.35,SIX*16-.2,musicBus,1500));
  const bassMap={0:0,3:0,6:12,8:0,11:7,14:12};
  if(st in bassMap) tone("sawtooth",freq(root-12+bassMap[st]),t,.22,.01,SIX*1.6,musicBus,380);
  if(st%2===0 && bar%2===1) tone("square",freq(ch[ARP[st/2]]+12),t,.035,.005,.18,musicBus,1800);
}
function scheduler(){
  while(nextTime < ctx.currentTime + .12){
    const swing = (step%2===1) ? SIX*.18 : 0;
    tick(step, nextTime + swing); nextTime += SIX; step++;
  }
}
function setMusic(on){
  musicOn = on; $("musicBtn").setAttribute("aria-pressed", on);
  vinyl.classList.toggle("spin", on);
  if(on){ ensureAudio(); step=0; nextTime=ctx.currentTime+.05; timer=setInterval(scheduler,25); }
  else { clearInterval(timer); timer=null; }
}

/* Sound effects */
const sfx = {
  draw(){
    if(!sfxOn) return; const t=ctx.currentTime;
    const f = noise(t,.22,.22,"bandpass",500,sfxBus,2); f.frequency.exponentialRampToValueAtTime(3500,t+.2);
    [72,76,79,84].forEach((m,k)=>tone("triangle",freq(m),t+.08+k*.055,.22,.005,.28,sfxBus));
    tone("sine",freq(96),t+.25,.08,.005,.5,sfxBus);
  },
  reset(){ if(!sfxOn) return; const t=ctx.currentTime; [79,76,72,67].forEach((m,k)=>tone("triangle",freq(m),t+k*.06,.18,.005,.22,sfxBus)); },
  empty(){ if(!sfxOn) return; const t=ctx.currentTime; tone("square",freq(52),t,.12,.005,.15,sfxBus,900); tone("square",freq(47),t+.17,.12,.005,.3,sfxBus,900); }
};

/* ============ EVENTS ============ */
cardEl.addEventListener("click", draw);
document.addEventListener("keydown", e=>{
  if($("editor").open || $("confirmBox").open) return;
  if((e.code==="Space"||e.code==="Enter") && (e.target===document.body)){ e.preventDefault(); draw(); }
});
$("musicBtn").onclick = ()=> setMusic(!musicOn);
$("vol").oninput = e=>{ if(musicBus) musicBus.gain.value = e.target.value/100; };
$("sfxBtn").onclick = ()=>{ sfxOn=!sfxOn; $("sfxBtn").setAttribute("aria-pressed", sfxOn); };
$("resetBtn").onclick = ()=> startOver(true);
$("keepBtn").onclick = ()=> $("confirmBox").close();
$("newGameBtn").onclick = ()=>{ $("confirmBox").close(); startOver(false); };
const fsEl = ()=> document.fullscreenElement || document.webkitFullscreenElement;
$("fsBtn").onclick = ()=>{
  if(fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else { const r = document.documentElement; (r.requestFullscreen || r.webkitRequestFullscreen)?.call(r); }
};
function onFsChange(){
  const on = !!fsEl();
  document.body.classList.toggle("is-fs", on);
  $("fsBtn").setAttribute("aria-label", on ? "Exit full screen" : "Enter full screen");
  $("fsBtn").title = on ? "Exit full screen" : "Full screen";
  setTimeout(fitText, 100);
}
document.addEventListener("fullscreenchange", onFsChange);
document.addEventListener("webkitfullscreenchange", onFsChange);
$("editBtn").onclick = ()=>{ $("cardText").value = cards.join("\n"); $("editor").showModal(); };
$("cancelBtn").onclick = ()=> $("editor").close();
$("defaultsBtn").onclick = ()=>{ $("cardText").value = DEFAULT_CARDS.join("\n"); };
$("saveBtn").onclick = ()=>{
  const list = $("cardText").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!list.length){ alert("Add at least one card, one per line."); return; }
  cards = list; $("editor").close(); startOver(false);
};
window.addEventListener("resize", fitText);
document.fonts?.ready.then(fitText);

load(); renderCard(false); renderTray();
</script>
</body>
</html>
